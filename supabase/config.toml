# Google Calendar reconciliation requires the backend secret.
[functions.scout-calendar]
verify_jwt = false
entrypoint = "./functions/scout-calendar/index.ts"
import_map = "./functions/scout-reader/deno.json"

[functions.scout-reader]
verify_jwt = false
entrypoint = "./functions/scout-reader/index.ts"
import_map = "./functions/scout-reader/deno.json"

[functions.scout-notify]
verify_jwt = false
entrypoint = "./functions/scout-notify/index.ts"
import_map = "./functions/scout-reader/deno.json"

# Slack authenticates raw request bodies with its signing secret.
[functions.scout-slack]
verify_jwt = false
entrypoint = "./functions/scout-slack/index.ts"
import_map = "./functions/scout-reader/deno.json"
