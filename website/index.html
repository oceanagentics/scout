<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Help Scout spot what matters. Review source-backed BBNJ findings, share your ranking and add your perspective." />
    <title>BBNJ Scout</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🐧%3C/text%3E%3C/svg%3E" />
    <script type="module" src="/main.js"></script>
  </head>
  <body>
    <main>
      <nav class="page-nav" aria-label="Scout">
        <a class="scout-brand" href="/" aria-label="Scout home"><span aria-hidden="true">🐧</span> Scout</a>
        <span id="scout-views" hidden><a href="#review" data-view="review" aria-current="page">Review</a><a href="#findings" data-view="findings">Records</a><a href="#trackers" data-view="trackers">Trackers</a><a href="#calendar" data-view="calendar">Calendar</a></span>
        <a id="sign-out" href="/" hidden>Sign out</a>
      </nav>
      <p id="status" role="status">Connecting…</p>
      <form id="sign-in" hidden>
        <button type="submit">Sign in with Google</button>
      </form>
      <div id="workspace" hidden></div>
    </main>
    <footer>BBNJ Scout · A project by Ocean Agentics</footer>
  </body>
</html>
